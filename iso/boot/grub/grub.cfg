set timeout=5
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,1024x768,800x600x32,800x600,auto
terminal_output gfxterm

menuentry "HALCYON" {
    echo "Loading HALCYON..."
    multiboot2 /boot/halcyon.elf
    module2 /boot/initrd.tar initrd
    boot
}

# On a virtual machine the Settings app changes the resolution while HALCYON
# runs. On real hardware it cannot -- there is no driver for your graphics card
# -- so the mode has to be chosen here, before the kernel starts.
#
# Note the order: `multiboot2` overwrites gfxpayload from the kernel's own
# Multiboot2 framebuffer tag, so setting it beforehand does nothing. It has to
# come after. Each entry falls back through plainer modes and finally `auto`,
# so a machine that cannot manage the mode still boots.
submenu "HALCYON (choose a screen resolution)" {
    menuentry "1920 x 1080" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1920x1080x32,1920x1080,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1680 x 1050" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1680x1050x32,1680x1050,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1600 x 900" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1600x900x32,1600x900,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1440 x 900" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1440x900x32,1440x900,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1366 x 768" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1366x768x32,1366x768,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1280 x 1024" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1280x1024x32,1280x1024,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1280 x 720" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1280x720x32,1280x720,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "1024 x 768" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=1024x768x32,1024x768,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "800 x 600" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=800x600x32,800x600,auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "Whatever the firmware prefers" {
        multiboot2 /boot/halcyon.elf
        set gfxpayload=auto
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "Back" {
        configfile /boot/grub/grub.cfg
    }
}

# Safe mode is about input, not resolution: it leaves the PS/2 mouse alone,
# which is the thing most likely to misbehave on an unfamiliar machine.
menuentry "HALCYON (safe mode: keyboard only, no mouse)" {
    echo "Loading HALCYON in safe mode..."
    multiboot2 /boot/halcyon.elf safe nomouse
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "HALCYON (fault self-test)" {
    echo "Loading HALCYON, will trigger a deliberate fault..."
    multiboot2 /boot/halcyon.elf selftest=fault
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "HALCYON (serial console on COM1)" {
    echo "Loading HALCYON with serial console..."
    multiboot2 /boot/halcyon.elf console=serial
    module2 /boot/initrd.tar initrd
    boot
}
