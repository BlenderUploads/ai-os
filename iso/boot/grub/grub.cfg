set timeout=5
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,1024x768,800x600x32,800x600,auto
terminal_output gfxterm

menuentry "HALCYON" {
    echo "Loading HALCYON..."
    multiboot2 /boot/halcyon.elf
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "HALCYON (safe mode: 800x600, no mouse)" {
    echo "Loading HALCYON in safe mode..."
    set gfxpayload=800x600x32
    multiboot2 /boot/halcyon.elf safe nomouse
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "HALCYON (serial console on COM1)" {
    echo "Loading HALCYON with serial console..."
    multiboot2 /boot/halcyon.elf console=serial
    module2 /boot/initrd.tar initrd
    boot
}
